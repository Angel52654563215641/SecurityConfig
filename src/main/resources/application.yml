server:
  port: 8443                       # Puerto HTTPS
  ssl:
    enabled: true
    key-store: classpath:keystore/keystore.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: secureapi
    enabled-protocols: TLSv1.2,TLSv1.3   # Solo TLS 1.2 y 1.3
    protocol: TLS

app:
  http-redirect:
    enabled: true                  # Escucha HTTP y redirige a HTTPS
    http-port: 8080
  cors:
    allowed-origins: http://localhost:4200,https://localhost:4200
  jwt:
    # Base64, minimo 256 bits. CAMBIAR en produccion via variable de entorno JWT_SECRET
    secret: ${JWT_SECRET:zfcdG8gg0nLoOcSXlAzUwwnUU3jSHnHyhLP4kIqVwMqPALD2mmRn0yhJkd6tPJ9D}
    expiration-minutes: 60

logging:
  level:
    root: INFO
    com.example.secureapi: INFO
    SECURITY_AUDIT: INFO
    # Muestra los fallos de handshake TLS (protocolo no soportado, cert invalido, etc.)
    org.apache.tomcat.util.net: DEBUG
